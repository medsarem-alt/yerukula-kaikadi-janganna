<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yerukula Kaikadi Janganna - Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.8;
      font-size: 14px;
    }

    .container {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    #logoutBtn {
      background: #dc2626;
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-title {
      color: #666;
      font-size: 14px;
    }

    .card-number {
      font-size: 32px;
      font-weight: bold;
      margin-top: 8px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #eef2ff;
      margin-bottom: 15px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

<header>
  <h1>Yerukula-Kaikadi Janganna</h1>
  <p>Admin Dashboard</p>
</header>

<div class="container">

  <div class="topbar">
    <div>
      <h2>Dashboard</h2>
      <div id="adminEmail"></div>
    </div>

    <button id="logoutBtn">Logout</button>
  </div>

  <div id="status" class="status">
    Checking admin access...
  </div>

  <div class="cards">

    <div class="card">
      <div class="card-title">Total Families</div>
      <div class="card-number" id="familyCount">0</div>
    </div>

    <div class="card">
      <div class="card-title">Total Members</div>
      <div class="card-number" id="memberCount">0</div>
    </div>

    <div class="card">
      <div class="card-title">Own House</div>
      <div class="card-number" id="houseCount">0</div>
    </div>

    <div class="card">
      <div class="card-title">Members with Disability</div>
      <div class="card-number" id="disabilityCount">0</div>
    </div>

  </div>

  <div class="section">
    <h3>Admin Panel</h3>
    <p>Family registration data will appear here after the registration form is connected.</p>
  </div>

</div>

<script>
  const supabaseClient = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_PUBLISHABLE_KEY
  );

  const statusBox = document.getElementById("status");

  async function checkAdminAndLoad() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "index.html";
      return;
    }

    document.getElementById("adminEmail").textContent =
      session.user.email || "";

    const { data: isAdmin, error: adminError } =
      await supabaseClient.rpc("is_admin");

    if (adminError) {
      statusBox.textContent =
        "Admin verification failed: " + adminError.message;
      statusBox.className = "status error";
      return;
    }

    if (!isAdmin) {
      statusBox.textContent =
        "Access denied. This account is not authorized as an admin.";
      statusBox.className = "status error";
      return;
    }

    statusBox.textContent = "Admin access verified.";
    statusBox.className = "status success";

    await loadDashboard();
  }


  async function loadDashboard() {

    const { count: families, error: familyError } =
      await supabaseClient
        .from("families")
        .select("*", { count: "exact", head: true });

    if (familyError) {
      statusBox.textContent =
        "Family data error: " + familyError.message;
      statusBox.className = "status error";
      return;
    }

    document.getElementById("familyCount").textContent =
      families || 0;


    const { count: members, error: memberError } =
      await supabaseClient
        .from("family_members")
        .select("*", { count: "exact", head: true });

    if (memberError) {
      statusBox.textContent =
        "Member data error: " + memberError.message;
      statusBox.className = "status error";
      return;
    }

    document.getElementById("memberCount").textContent =
      members || 0;


    const { count: houses, error: houseError } =
      await supabaseClient
        .from("families")
        .select("*", { count: "exact", head: true })
        .eq("own_house", true);

    if (!houseError) {
      document.getElementById("houseCount").textContent =
        houses || 0;
    }


    const { count: disabled, error: disabilityError } =
      await supabaseClient
        .from("family_members")
        .select("*", { count: "exact", head: true })
        .eq("disability", true);

    if (!disabilityError) {
      document.getElementById("disabilityCount").textContent =
        disabled || 0;
    }
  }


  document.getElementById("logoutBtn").addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    window.location.href = "index.html";
  });


  checkAdminAndLoad();
</script>

</body>
</html>
