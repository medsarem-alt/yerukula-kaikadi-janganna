<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Registration</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.section {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section h2 {
  margin-top: 0;
  font-size: 20px;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 6px;
  font-weight: 600;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.member {
  border: 1px solid #ddd;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  background: #fafafa;
}

.member h3 {
  margin-top: 0;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 12px;
}

.add-btn {
  background: #198754;
  color: white;
}

.remove-btn {
  background: #dc3545;
  color: white;
}

.submit-btn {
  background: #0d6efd;
  color: white;
}

.hidden {
  display: none;
}

.note {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Family Registration</h1>

<form id="registrationForm">

<!-- 1. FAMILY DETAILS -->
<div class="section">
<h2>1. Family Details</h2>

<label>Family Head Name</label>
<input type="text" name="family_head_name" required>

<label>Mobile Number</label>
<input type="tel" name="mobile_number" maxlength="10" required>

<label>State</label>
<input type="text" name="state" required>

<label>District</label>
<input type="text" name="district" required>

<label>City / Village</label>
<input type="text" name="city_village" required>

<label>Full Address</label>
<textarea name="full_address" required></textarea>

<label>Total Family Members</label>
<input type="number" name="total_family_members" min="1" required>

<label>Housing</label>
<select name="housing" required>
  <option value="">Select</option>
  <option value="Own House">Own House</option>
  <option value="Rented">Rented</option>
  <option value="Other">Other</option>
</select>

<label>House Condition</label>
<textarea name="house_condition"></textarea>

</div>


<!-- 2. FAMILY MEMBERS -->
<div class="section">

<h2>2. Family Members</h2>

<div id="membersContainer"></div>

<button type="button" class="add-btn" onclick="addMember()">
+ Add Family Member
</button>

</div>


<!-- 3. EDUCATION -->
<div class="section">

<h2>3. Education</h2>

<label>Is any family member facing an education-related problem?</label>

<select id="educationProblem" name="education_problem" onchange="toggleEducationDetails()" required>
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<div id="educationDetails" class="hidden">

<label>Education Problem Details</label>
<textarea name="education_problem_details"></textarea>

</div>

</div>


<!-- 4. HEALTHCARE ACCESS -->
<div class="section">

<h2>4. Healthcare Access</h2>

<label>Difficulty Accessing Healthcare</label>

<select id="healthcareProblem" name="healthcare_access_problem" onchange="toggleHealthcareDetails()" required>
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<div id="healthcareDetails" class="hidden">

<label>Healthcare Access Details</label>
<textarea name="healthcare_access_details"></textarea>

</div>

</div>


<!-- 5. FAMILY INSURANCE -->
<div class="section">

<h2>5. Family Insurance</h2>

<label>Health Insurance</label>
<select name="health_insurance" required>
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<label>Term Life Insurance</label>
<select name="term_life_insurance" required>
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<label>Other Insurance</label>
<select name="other_insurance" required>
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

</div>


<button type="submit" class="submit-btn">
Submit Registration
</button>

<div id="message"></div>

</form>

</div>


<script>

let memberCount = 0;

function addMember() {

  memberCount++;

  const container = document.getElementById("membersContainer");

  const member = document.createElement("div");

  member.className = "member";

  member.innerHTML = `

    <h3>Family Member ${memberCount}</h3>

    <label>Full Name</label>
    <input type="text" name="member_${memberCount}_name" required>

    <label>Date of Birth</label>
    <input type="date" name="member_${memberCount}_dob" required>

    <label>Age</label>
    <input type="number" name="member_${memberCount}_age" min="0" required>

    <label>Gender</label>
    <select name="member_${memberCount}_gender" required>
      <option value="">Select</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label>Relationship to Family Head</label>
    <input type="text" name="member_${memberCount}_relationship" required>

    <label>Marital Status</label>
    <select name="member_${memberCount}_marital_status" required>
      <option value="">Select</option>
      <option value="Single">Single</option>
      <option value="Married">Married</option>
      <option value="Widowed">Widowed</option>
      <option value="Divorced">Divorced</option>
      <option value="Other">Other</option>
    </select>

    <label>Mobile Number</label>
    <input type="tel" name="member_${memberCount}_mobile" maxlength="10">

    <label>Education</label>
    <input type="text" name="member_${memberCount}_education">

    <label>Education Status</label>
    <select name="member_${memberCount}_education_status">
      <option value="">Select</option>
      <option value="Currently Studying">Currently Studying</option>
      <option value="Completed">Completed</option>
      <option value="Not Studying">Not Studying</option>
      <option value="Not Applicable">Not Applicable</option>
    </select>

    <label>Occupation</label>
    <input type="text" name="member_${memberCount}_occupation">

    <label>Employment Status</label>
    <select name="member_${memberCount}_employment_status">
      <option value="">Select</option>
      <option value="Employed">Employed</option>
      <option value="Self Employed">Self Employed</option>
      <option value="Unemployed">Unemployed</option>
      <option value="Student">Student</option>
      <option value="Not Applicable">Not Applicable</option>
    </select>

    <label>Health Condition</label>
    <select name="member_${memberCount}_health_condition"
            onchange="toggleMemberHealth(this, ${memberCount})"
            required>
      <option value="">Select</option>
      <option value="Good">Good</option>
      <option value="Not Good">Not Good</option>
    </select>

    <div id="health_${memberCount}" class="hidden">

      <label>Health Problem / Disease Details</label>
      <textarea name="member_${memberCount}_health_problem"></textarea>

      <label>Long-term Health Problem</label>
      <select name="member_${memberCount}_long_term_health">
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label>Regular Treatment Required</label>
      <select name="member_${memberCount}_regular_treatment">
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label>Disability</label>
      <select name="member_${memberCount}_disability">
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label>Help / Support Required</label>
      <select name="member_${memberCount}_help_required"
              onchange="toggleHelpDetails(this, ${memberCount})">
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <div id="help_${memberCount}" class="hidden">

        <label>Help / Support Details</label>
        <textarea name="member_${memberCount}_help_details"></textarea>

      </div>

    </div>

    <button type="button"
            class="remove-btn"
            onclick="this.parentElement.remove()">
      Remove Member
    </button>
  `;

  container.appendChild(member);
}


function toggleMemberHealth(select, id) {

  const box = document.getElementById("health_" + id);

  if (select.value === "Not Good") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");
  }
}


function toggleHelpDetails(select, id) {

  const box = document.getElementById("help_" + id);

  if (select.value === "Yes") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");
  }
}


function toggleEducationDetails() {

  const value = document.getElementById("educationProblem").value;
  const box = document.getElementById("educationDetails");

  if (value === "Yes") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");
  }
}


function toggleHealthcareDetails() {

  const value = document.getElementById("healthcareProblem").value;
  const box = document.getElementById("healthcareDetails");

  if (value === "Yes") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");
  }
}


document.getElementById("registrationForm").addEventListener("submit", function(event) {

  event.preventDefault();

  document.getElementById("message").style.color = "green";
  document.getElementById("message").textContent =
    "Form is ready. Database submission will be connected next.";

});


// First family member automatically added
addMember();

</script>

</body>
</html>
