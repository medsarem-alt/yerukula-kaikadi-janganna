* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;

h1 {

  margin-bottom: 5px;
}

h2 {
  margin-top: 28px;
  padding-bottom: 8px;
  border-bottom: 2px solid #eee;
}

h3 {
  margin-top: 15px;
}

label {
  display: block;
  margin-top: 13px;
  font-weight: 600;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
}

.hidden {
  display: none !important;
}

.member {
  margin-top: 15px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fafafa;
}

button {
  border: none;
  border-radius: 7px;
  padding: 12px 16px;
  font-size: 15px;
  cursor: pointer;
}

.add-btn {
  width: 100%;
  margin-top: 15px;
  background: #1976d2;
  color: white;
}

.remove-btn {
  margin-top: 15px;
  background: #d32f2f;
  color: white;
}

.submit-btn {

.success {

.error {

     FAMILY DETAILS
===================================================== -->

<h2>1. Family Details</h2>

<label>Family Head Name *</label>
<input
  type="text"
  id="familyHeadName"
  name="family_head_name"
  required
>

<label>Family Head Mobile Number *</label>
<input
  type="tel"
  id="familyMobile"
  name="family_mobile"
  required
>

<label>State *</label>
<input
  type="text"
  name="state"
  required
>

<label>District *</label>
<input
  type="text"
  name="district"
  required
>

<label>City / Village *</label>
<input
  type="text"
  name="city_village"
  required
>

<label>Full Address *</label>
<textarea
  name="full_address"
  required
></textarea>

<label>Housing *</label>
<select name="housing" required>
  <option value="">Select</option>
  <option value="Own House">Own House</option>
  <option value="Rented">Rented</option>
  <option value="Other">Other</option>
</select>

<label>House Condition *</label>
<select name="house_condition" required>
  <option value="">Select</option>
  <option value="Good">Good</option>
  <option value="Average">Average</option>
  <option value="Poor">Poor</option>
</select>

<label>Total Family Members *</label>
<input
  type="number"
  id="totalMembers"
  name="total_members"
  min="1"
  required
>

<!-- =====================================================
     FAMILY HEAD EDUCATION
===================================================== -->

<h2>2. Family Head Education</h2>

<label>Education</label>

<input
  type="text"
  name="family_head_education"
  placeholder="Example: 10th, 12th, Graduate"
>

<select
  id="familyHeadEducationStatus"

  <option value="Not Applicable">Not Applicable</option>

</select>

<div
  id="familyHeadDiscontinuedSection"

    <option value="No">No</option>
