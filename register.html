<!DOCTYPE html>
<html lang="en">
<head>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 850px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  font-size: 24px;
  margin-bottom: 5px;
}

h2 {
  font-size: 19px;
  margin-top: 25px;
  padding-bottom: 8px;
  border-bottom: 2px solid #eee;
}

h3 {
  font-size: 17px;
  margin-top: 10px;
}

label {
  display: block;
  margin-top: 13px;
  font-weight: 600;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.member {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
  background: #fafafa;
}

.hidden {
  display: none !important;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 12px 16px;
  font-size: 15px;
  cursor: pointer;
}

.add-btn {
  background: #1976d2;
  color: white;
  width: 100%;
  margin-top: 15px;
}

.remove-btn {
  background: #d32f2f;
  color: white;
  margin-top: 15px;
}

.submit-btn {
  background: #2e7d32;
  color: white;
  width: 100%;
  margin-top: 25px;
  font-size: 17px;
  font-weight: bold;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  display: none;
}

.success {
  display: block;
  background: #e8f5e9;
  color: #1b5e20;
}

.error {
  display: block;
  background: #ffebee;
  color: #b71c1c;
}

.small-note {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">

<h1>Yerukula-Kaikadi Samaj</h1>
<p style="text-align:center;">Family Census / Registration Form</p>

<form id="familyForm">

<!-- ================= FAMILY DETAILS ================= -->

<h2>1. Family Details</h2>

<label>Family Head Name *</label>
<input type="text" name="family_head_name" required>

<label>Family Head Mobile Number *</label>
<input type="tel" name="family_mobile" required>

<label>State *</label>
<input type="text" name="state" required>

<label>District *</label>
<input type="text" name="district" required>

<label>City / Village *</label>
<input type="text" name="city_village" required>

<label>Full Address *</label>
<textarea name="full_address" required></textarea>

<label>Housing *</label>
<select name="housing" required>
  <option value="">Select</option>
  <option value="Own House">Own House</option>
  <option value="Rented">Rented</option>
  <option value="Other">Other</option>
</select>

<label>House Condition *</label>
<select name="house_condition" required>
  <option value="">Select</option>
  <option value="Good">Good</option>
  <option value="Average">Average</option>
  <option value="Poor">Poor</option>
</select>

<label>Total Family Members *</label>
<input type="number" id="totalMembers" name="total_members" min="1" required>

<!-- ================= FAMILY HEAD EDUCATION ================= -->

<h2>2. Family Head Education</h2>

<label>Education</label>
<input type="text" name="family_head_education"
       placeholder="Example: 10th, 12th, Graduate">

<label>Education Status</label>
<select name="family_head_education_status"
        onchange="toggleFamilyHeadEducation(this)">
  <option value="">Select</option>
  <option value="Currently Studying">Currently Studying</option>
  <option value="Completed">Completed</option>
  <option value="Education Discontinued">Education Discontinued</option>
  <option value="Never Studied">Never Studied</option>
  <option value="Not Applicable">Not Applicable</option>
</select>

<div id="familyHeadEducationDiscontinuedBox" class="hidden">

  <label>Reason for Discontinuing Education</label>
  <textarea name="family_head_education_discontinue_reason"></textarea>

  <label>Would you like to continue education in future?</label>
  <select name="family_head_future_education"
          onchange="toggleFamilyHeadFutureEducation(this)">
    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <div id="familyHeadEducationHelpBox" class="hidden">

    <label>Education Help / Support Required?</label>
    <select name="family_head_education_help"
            onchange="toggleFamilyHeadEducationHelp(this)">
      <option value="">Select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <div id="familyHeadEducationHelpDetailsBox" class="hidden">
      <label>Education Help / Support Details</label>
      <textarea name="family_head_education_help_details"></textarea>
    </div>

  </div>

</div>

<!-- ================= FAMILY MEMBERS ================= -->

<h2>3. Family Members</h2>

<div id="membersContainer"></div>

<button type="button" class="add-btn" id="addMemberBtn">
  + Add Family Member
</button>

<!-- ================= HEALTHCARE ================= -->

<h2>4. Healthcare Access</h2>

<label>Difficulty Accessing Healthcare?</label>
<select name="healthcare_access_problem"
        onchange="toggleHealthcare(this)">
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<div id="healthcareDetailsBox" class="hidden">
  <label>Healthcare Access Details</label>
  <textarea name="healthcare_access_details"></textarea>
</div>

<!-- ================= INSURANCE ================= -->

<h2>5. Family Insurance</h2>

<label>Health Insurance</label>
<select name="health_insurance">
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<label>Term Life Insurance</label>
<select name="term_life_insurance">
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<label>Other Insurance</label>
<select name="other_insurance">
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<button type="submit" class="submit-btn">
  Submit Registration
</button>

<div id="statusMessage" class="status"></div>

</form>

</div>

        </select>

        <div id="memberEducationHelpDetails_${id}" class="hidden">

          <label>Education Help / Support Details</label>

          <textarea
            name="member_${id}_education_help_details">
          </textarea>

        </div>

      </div>

    </div>


    <!-- OCCUPATION -->

    <h3>Employment</h3>

    <label>Occupation</label>

    <input type="text"

    <label>Employment Status</label>

    <label>Any Health Problem?</label>

    <select

      <option value="">Select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>

    </select>


    <div id="memberHealth_${id}" class="hidden">

      <label>Health Problem / Disease Details</label>

      <textarea
        name="member_${id}_disease_details">
      </textarea>


      <label>Long-term Health Problem?</label>

      <select name="member_${id}_long_term_condition">

        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>

      </select>


      <label>Regular Treatment Required?</label>

      <select name="member_${id}_treatment_status">

        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>

      </select>


      <label>Help / Support Required?</label>

      <select
        name="member_${id}_health_help_required"
        onchange="toggleMemberHealthHelp(this, ${id})">

        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>

      </select>


      <div id="memberHealthHelpDetails_${id}" class="hidden">

        <label>Health Help / Support Details</label>

        <textarea
          name="member_${id}_health_help_details">

      </div>

    <!-- DISABILITY -->

    <h3>Disability</h3>

    <label>Any Disability?</label>

    <select
      name="member_${id}_disability"

      <option value="">Select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>

    </select>


    <div id="memberDisability_${id}" class="hidden">

      <label>Type of Disability</label>

      <input type="text"
             name="member_${id}_disability_type">

        name="member_${id}_disability_details">

/* =========================================================
   REMOVE MEMBER
   ========================================================= */

function removeMember(button) {

  const member = button.closest(".member");

  if (member) {
    member.remove();
  }

  updateMemberNumbers();
  updateTotalMembers();
}


/* =========================================================
   UPDATE MEMBER NUMBERS
   ========================================================= */

function updateMemberNumbers() {

  const members =
    document.querySelectorAll(".member");

  members.forEach((member, index) => {

    const number = index + 1;

    const heading = member.querySelector("h3");

    if (heading) {
      heading.textContent = "Family Member " + number;
    }

  });

}


/* =========================================================
   TOTAL MEMBERS
   ========================================================= */

function updateTotalMembers() {

  const total =
    document.querySelectorAll(".member").length;

  const input =
    document.getElementById("totalMembers");

  if (input && total > 0) {
    input.value = total;
  }

}


/* =========================================================
   FAMILY HEAD EDUCATION
   ========================================================= */

function toggleFamilyHeadEducation(select) {

  const box =
    document.getElementById(
      "familyHeadEducationDiscontinuedBox"
    );

  if (select.value === "Education Discontinued") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");

    document.querySelector(
      '[name="family_head_education_discontinue_reason"]'
    ).value = "";

    document.querySelector(
      '[name="family_head_future_education"]'
    ).value = "";

    document.getElementById(
      "familyHeadEducationHelpBox"
    ).classList.add("hidden");

    document.getElementById(
      "familyHeadEducationHelpDetailsBox"
    ).classList.add("hidden");
  }

}


function toggleFamilyHeadFutureEducation(select) {

  const box =
    document.getElementById(
      "familyHeadEducationHelpBox"
    );

  if (select.value === "Yes") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");

    document.querySelector(
      '[name="family_head_education_help"]'
    ).value = "";

    document.getElementById(
      "familyHeadEducationHelpDetailsBox"
    ).classList.add("hidden");
  }

}


function toggleFamilyHeadEducationHelp(select) {

    document.getElementById(
      "familyHeadEducationHelpDetailsBox"
    );

  if (select.value === "Yes") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");
  }

}

   MEMBER EDUCATION

function toggleMemberEducation(select, id) {

  const box =

      `memberEducationDiscontinued_${id}`

  if (select.value === "Education Discontinued") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");

    const future =
      document.querySelector(
        `[name="member_${id}_future_education"]`
      );

    if (future) future.value = "";

    document.getElementById(
      `memberEducationHelp_${id}`
    ).classList.add("hidden");

    document.getElementById(
      `memberEducationHelpDetails_${id}`
    ).classList.add("hidden");
  }

}


function toggleMemberFutureEducation(select, id) {

  const box =
    document.getElementById(
      `memberEducationHelp_${id}`

      document.querySelector(
        `[name="member_${id}_education_help"]`
      );

    if (help) help.value = "";

    document.getElementById(
      `memberEducationHelpDetails_${id}`
    ).classList.add("hidden");
  }

}


function toggleMemberEducationHelp(select, id) {

/* =========================================================

function toggleMemberHealth(select, id) {

    box.classList.remove("hidden");

    box.classList.add("hidden");

    if (helpBox) {

    }

    const helpSelect =
      document.querySelector(
        `[name="member_${id}_health_help_required"]`
      );

    if (helpSelect) {
      helpSelect.value = "";
    }

  }

}


/* =========================================================
   MEMBER HEALTH HELP
   ========================================================= */

function toggleMemberHealthHelp(select, id) {

    );

  }

   ADD FIRST MEMBER
   ========================================================= */

document
  .getElementById("addMemberBtn")
  .addEventListener("clic
