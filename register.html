* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  margin-top: 28px;
  padding-bottom: 8px;
  border-bottom: 2px solid #eee;
}

h3 {
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 13px;
  font-weight: 600;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.hidden {
  display: none !important;
}

.member {
  margin-top: 15px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fafafa;
}

.member-title {
  display: flex;

}

.member-title h3 {
  margin: 0;
}

.add-btn {
  width: 100%;
  margin-top: 15px;
  background: #1976d2;
  color: white;
}

.remove-btn {
  margin-top: 15px;
  background: #d32f2f;
  color: white;
}

.submit-btn {
  width: 100%;
  margin-top: 25px;
  background: #2e7d32;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.6;

}

#memberCount {
  margin-top: 10px;
  color: #555;
  font-size: 14px;
}

#statusMessage {
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;

}

.success {
  display: block !important;
  background: #e8f5e9;
  color: #1b5e20;
}

.error {

  required

  name="state"
  required

<input
  type="text"
  name="district"
  required
>

<input
  type="text"
  name="city_village"
  required

<textarea

  required

===================================================== -->
