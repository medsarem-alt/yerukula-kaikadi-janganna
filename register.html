<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yerukula-Kaikadi Samaj - Family Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

h2 {
  margin-top: 28px;
  padding-bottom: 8px;
  border-bottom: 2px solid #eee;
}

h3 {
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 13px;
  font-weight: 600;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.hidden {
  display: none !important;
}

.member {
  margin-top: 15px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fafafa;
}

.member-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.member-title h3 {
  margin: 0;
}

.add-btn {
  width: 100%;
  margin-top: 15px;
  background: #1976d2;
  color: white;
}

.remove-btn {
  margin-top: 15px;
  background: #d32f2f;
  color: white;
}

.submit-btn {
  width: 100%;
  margin-top: 25px;
  background: #2e7d32;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button {
  border: none;
  border-radius: 7px;
  padding: 12px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#memberCount {
  margin-top: 10px;
  color: #555;
  font-size: 14px;
}

#statusMessage {
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  display: none;
  white-space: pre-wrap;
}

.success {
  display: block !important;
  background: #e8f5e9;
  color: #1b5e20;
}

.error {
  display: block !important;
  background: #ffebee;
  color: #b71c1c;
}

.info {
  display: block !important;
  background: #e3f2fd;
  color: #0d47a1;
}

.section-box {
  margin-top: 15px;
  padding: 12px;
  border-left: 4px solid #1976d2;
  background: #f8fbff;
  border-radius: 6px;
}

.small-note {
  color: #666;
  font-size: 13px;
  margin-top: 6px;
}
</style>
</head>

<body>

<div class="container">

<h1>Yerukula-Kaikadi Samaj</h1>

<p style="text-align:center;">
Family Census / Registration Form
</p>

<form id="familyForm">

<!-- =====================================================
     1. FAMILY DETAILS
===================================================== -->

<h2>1. Family Details</h2>

<label>Family Head Name *</label>
<input
  type="text"
  id="familyHeadName"
  name="family_head_name"
  required
>

<label>Family Head Date of Birth *</label>
<input
  type="date"
  id="familyHeadDob"
  name="family_head_dob"
  required
>

<label>Family Head Age *</label>
<input
  type="number"
  id="familyHeadAge"
  name="family_head_age"
  min="0"
  max="120"
  required
>

<label>Family Head Gender *</label>
<select
  id="familyHeadGender"
  name="family_head_gender"
  required
>
  <option value="">Select</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
  <option value="Other">Other</option>
</select>

<label>Family Head Marital Status *</label>
<select
  id="familyHeadMaritalStatus"
  name="family_head_marital_status"
  required
>
  <option value="">Select</option>
  <option value="Married">Married</option>
  <option value="Unmarried">Unmarried</option>
  <option value="Widowed">Widowed</option>
  <option value="Divorced">Divorced</option>
  <option value="Separated">Separated</option>
  <option value="Other">Other</option>
</select>

<label>Family Head Disability?</label>
<select
  id="familyHeadDisability"
  name="family_head_disability"
>
  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<label>Family Head Mobile Number *</label>
<input
  type="tel"
  id="familyMobile"
  name="family_mobile_number"
  inputmode="numeric"
  pattern="[0-9]{10}"
  maxlength="10"
  minlength="10"
  placeholder="10-digit mobile number"
  required
>

<label>State *</label>
<input
  type="text"
  name="state"
  required
>

<label>District *</label>
<input
  type="text"
  name="district"
  required
>

<label>City / Village *</label>
<input
  type="text"
  name="city_village"
  required
>

<label>Full Address *</label>
<textarea
  name="full_address"
  required
></textarea>

<label>Housing *</label>
<select name="own_house" required>
  <option value="">Select</option>
  <option value="Own House">Own House</option>
  <option value="Rented">Rented</option>
  <option value="Other">Other</option>
</select>

<label>House Condition *</label>
<select name="house_condition" required>
  <option value="">Select</option>
  <option value="Good">Good</option>
  <option value="Average">Average</option>
  <option value="Poor">Poor</option>
</select>

<label>Total Family Members *</label>
<input
  type="number"
  id="totalMembers"
  name="total_members"
  min="1"
  required
>

<p class="small-note">
  Enter the number of family members to be added below.
</p>


<!-- =====================================================
     2. FAMILY HEAD EDUCATION
===================================================== -->

<h2>2. Family Head Education</h2>

<label>Education</label>

<input
  type="text"
  name="family_head_education"
  placeholder="Example: 10th, 12th, Graduate"
>

<label>Education Status</label>

<select
  id="familyHeadEducationStatus"
  name="family_head_education_status"
>

  <option value="">Select</option>

  <option value="Currently Studying">
    Currently Studying
  </option>

  <option value="Completed">
    Completed
  </option>

  <option value="Education Discontinued">
    Education Discontinued
  </option>

  <option value="Never Studied">
    Never Studied
  </option>

  <option value="Not Applicable">
    Not Applicable
  </option>

</select>

<div
  id="familyHeadDiscontinuedSection"
  class="hidden section-box"
>

  <label>
    Reason for Discontinuing Education
  </label>

  <textarea
    name="family_head_education_discontinue_reason"
    placeholder="Please explain why education was discontinued"
  ></textarea>

  <label>
    Would you like to continue education in future?
  </label>

  <select
    id="familyHeadFutureEducation"
    name="family_head_future_education"
  >

    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>

  </select>

  <div
    id="familyHeadEducationHelpSection"
    class="hidden"
  >

    <label>
      Education Help / Support Required?
    </label>

    <select
      id="familyHeadEducationHelp"
      name="family_head_education_help"
    >

      <option value="">Select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>

    </select>

    <div
      id="familyHeadEducationHelpDetailsSection"
      class="hidden"
    >

      <label>
        Education Help / Support Details
      </label>

      <textarea
        name="family_head_education_help_details"
        placeholder="What type of education help or support is required?"
      ></textarea>

    </div>

  </div>

</div>


<!-- =====================================================
     3. FAMILY HEAD EMPLOYMENT
===================================================== -->

<div id="familyHeadEmploymentSection">

<h2>3. Family Head Employment</h2>

<label>Occupation</label>

<input
  type="text"
  id="familyHeadOccupation"
  name="family_head_occupation"
  placeholder="Example: Driver, Labourer, Business, Housewife"
>

<label>Employment Status</label>

<select
  id="familyHeadEmploymentStatus"
  name="family_head_employment_status"
>

  <option value="">Select</option>

  <option value="Employed">Employed</option>

  <option value="Self Employed">
    Self Employed
  </option>

  <option value="Unemployed">
    Unemployed
  </option>

  <option value="Currently Studying">
    Currently Studying
  </option>

  <option value="Retired">
    Retired
  </option>

  <option value="Not Applicable">
    Not Applicable
  </option>

  <option value="Other">
    Other
  </option>

</select>

</div>


<!-- =====================================================
     4. FAMILY HEAD HEALTH
===================================================== -->

<h2>4. Family Head Health Condition</h2>

<label>Any Health Problem?</label>

<select
  id="healthcareAccess"
  name="healthcare_access_problem"
>

  <option value="">Select</option>

  <option value="Yes">Yes</option>

  <option value="No">No</option>

</select>

<div
  id="healthcareDetailsSection"
  class="hidden section-box"
>

  <label>
    Health Problem / Disease Details
  </label>

  <textarea
    id="healthcareAccessDetails"
    name="healthcare_access_details"
    placeholder="Please describe the health problem or disease"
  ></textarea>

  <label>
    Long-term Health Problem?
  </label>

  <select
    id="familyHeadLongTermCondition"
    name="family_head_long_term_condition"
  >

    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>

  </select>

  <label>
    Regular Treatment Required?
  </label>

  <select
    id="familyHeadTreatmentStatus"
    name="family_head_treatment_status"
  >

    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>

  </select>

  <label>
    Healthcare Help / Support Required?
  </label>

  <select
    id="healthcareHelpRequired"
    name="healthcare_help_required"
  >

    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>

  </select>

  <div
    id="healthcareHelpDetailsSection"
    class="hidden"
  >

    <label>
      What Healthcare Help / Support is Required?
    </label>

    <textarea
      id="healthcareHelpDetails"
      name="healthcare_help_details"
      placeholder="Please describe the help or support required"
    ></textarea>

  </div>

</div>


<!-- =====================================================
     5. FAMILY MEMBERS
===================================================== -->

<h2>5. Family Members</h2>

<div id="membersContainer"></div>

<div id="memberCount">
  No family members added yet.
</div>

<button
  type="button"
  id="addMemberBtn"
  class="add-btn"
>
  + Add Family Member
</button>


<!-- =====================================================
     6. INSURANCE
===================================================== -->

<h2>6. Family Insurance</h2>

<label>Health Insurance</label>

<select
  id="healthInsurance"
  name="health_insurance"
>

  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>

</select>

<div
  id="healthInsuranceHelpSection"
  class="hidden section-box"
>

  <label>
    Would you like Health Insurance?
  </label>

  <select
    id="healthInsuranceNeeded"
    name="health_insurance_needed"
  >

    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>

  </select>

  <div
    id="healthInsuranceHelpDetailsSection"
    class="hidden"
  >

    <label>
      What help / support do you need for Health Insurance?
    </label>

    <textarea
      id="healthInsuranceHelpDetails"
      name="health_insurance_help_details"
      placeholder="Please describe the help or support required"
    ></textarea>

  </div>

</div>

<label>Term Life Insurance</label>

<select name="term_life_insurance">

  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>

</select>

<label>Other Insurance</label>

<select name="other_insurance">

  <option value="">Select</option>
  <option value="Yes">Yes</option>
  <option value="No">No</option>

</select>


<!-- =====================================================
     SUBMIT
===================================================== -->

<button
  type="submit"
  id="submitBtn"
  class="submit-btn"
>
  Submit Registration
</button>

<div id="statusMessage"></div>

</form>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://dncpytissribxjsbrfxp.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_ARgUWSyNuJL3izkC7xd3cQ_vyUqAsEn";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let memberCounter = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const familyForm =
  document.getElementById("familyForm");

const membersContainer =
  document.getElementById("membersContainer");

const addMemberBtn =
  document.getElementById("addMemberBtn");

const memberCount =
  document.getElementById("memberCount");

const statusMessage =
  document.getElementById("statusMessage");

const submitBtn =
  document.getElementById("submitBtn");


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(message, type) {

  statusMessage.textContent = message;

  statusMessage.className = "";

  statusMessage.id = "statusMessage";

  statusMessage.classList.add(type);

}


/* =====================================================
   FAMILY HEAD EDUCATION
===================================================== */

const familyHeadEducationStatus =
  document.getElementById(
    "familyHeadEducationStatus"
  );

const familyHeadDiscontinuedSection =
  document.getElementById(
    "familyHeadDiscontinuedSection"
  );

const familyHeadFutureEducation =
  document.getElementById(
    "familyHeadFutureEducation"
  );

const familyHeadEducationHelpSection =
  document.getElementById(
    "familyHeadEducationHelpSection"
  );

const familyHeadEducationHelp =
  document.getElementById(
    "familyHeadEducationHelp"
  );

const familyHeadEducationHelpDetailsSection =
  document.getElementById(
    "familyHeadEducationHelpDetailsSection"
  );

const familyHeadEducationDiscontinueReason =
  document.querySelector(
    '[name="family_head_education_discontinue_reason"]'
  );

const familyHeadEducationHelpDetails =
  document.querySelector(
    '[name="family_head_education_help_details"]'
  );

const familyHeadEmploymentSection =
  document.getElementById(
    "familyHeadEmploymentSection"
  );

const familyHeadEmploymentStatus =
  document.getElementById(
    "familyHeadEmploymentStatus"
  );

const familyHeadOccupation =
  document.getElementById(
    "familyHeadOccupation"
  );


familyHeadEducationStatus.addEventListener(
  "change",
  function() {

    if (
      this.value ===
      "Currently Studying"
    ) {

      familyHeadEmploymentSection
        .classList
        .add("hidden");

      familyHeadEmploymentStatus.value = "";

      familyHeadOccupation.value = "";

    } else {

      familyHeadEmploymentSection
        .classList
        .remove("hidden");

    }


    if (
      this.value ===
      "Education Discontinued"
    ) {

      familyHeadDiscontinuedSection
        .classList
        .remove("hidden");

    } else {

      familyHeadDiscontinuedSection
        .classList
        .add("hidden");

      familyHeadEducationDiscontinueReason.value = "";

      familyHeadFutureEducation.value = "";

      familyHeadEducationHelp.value = "";

      familyHeadEducationHelpDetails.value = "";

      familyHeadEducationHelpSection
        .classList
        .add("hidden");

      familyHeadEducationHelpDetailsSection
        .classList
        .add("hidden");

    }

  }
);


familyHeadFutureEducation.addEventListener(
  "change",
  function() {

    if (this.value === "Yes") {

      familyHeadEducationHelpSection
        .classList
        .remove("hidden");

    } else {

      familyHeadEducationHelpSection
        .classList
        .add("hidden");

      familyHeadEducationHelp.value = "";

      familyHeadEducationHelpDetails.value = "";

      familyHeadEducationHelpDetailsSection
        .classList
        .add("hidden");

    }

  }
);


familyHeadEducationHelp.addEventListener(
  "change",
  function() {

    if (this.value === "Yes") {

      familyHeadEducationHelpDetailsSection
        .classList
        .remove("hidden");

    } else {

      familyHeadEducationHelpDetailsSection
        .classList
        .add("hidden");

      familyHeadEducationHelpDetails.value = "";

    }

  }
);


/* =====================================================
   INITIAL FAMILY HEAD EMPLOYMENT STATE
===================================================== */

if (
  familyHeadEducationStatus.value ===
  "Currently Studying"
) {

  familyHeadEmploymentSection
    .classList
    .add("hidden");

}


/* =====================================================
   FAMILY HEAD HEALTH
===================================================== */

const healthcareAccess =
  document.getElementById(
    "healthcareAccess"
  );

const healthcareDetailsSection =
  document.getElementById(
    "healthcareDetailsSection"
  );

const healthcareAccessDetails =
  document.getElementById(
    "healthcareAccessDetails"
  );

const familyHeadLongTermCondition =
  document.getElementById(
    "familyHeadLongTermCondition"
  );

const familyHeadTreatmentStatus =
  document.getElementById(
    "familyHeadTreatmentStatus"
  );

const healthcareHelpRequired =
  document.getElementById(
    "healthcareHelpRequired"
  );

const healthcareHelpDetailsSection =
  document.getElementById(
    "healthcareHelpDetailsSection"
  );

const healthcareHelpDetails =
  document.getElementById(
    "healthcareHelpDetails"
  );


healthcareAccess.addEventListener(
  "change",
  function() {

    if (this.value === "Yes") {

      healthcareDetailsSection
        .classList
        .remove("hidden");

    } else {

      healthcareDetailsSection
        .classList
        .add("hidden");

      healthcareAccessDetails.value = "";

      familyHeadLongTermCondition.value = "";

      familyHeadTreatmentStatus.value = "";

      healthcareHelpRequired.value = "";

      healthcareHelpDetails.value = "";

      healthcareHelpDetailsSection
        .classList
        .add("hidden");

    }

  }
);


healthcareHelpRequired.addEventListener(
  "change",
  function() {

    if (this.value === "Yes") {

      healthcareHelpDetailsSection
        .classList
        .remove("hidden");

    } else {

      healthcareHelpDetailsSection
        .classList
        .add("hidden");

      healthcareHelpDetails.value = "";

    }

  }
);


/* =====================================================
   UPDATE MEMBER COUNT
===================================================== */

function updateMemberCount() {

  const count =
    membersContainer.querySelectorAll(
      ".member"
    ).length;


  if (count === 0) {

    memberCount.textContent =
      "No family members added yet.";

  } else {

    memberCount.textContent =
      count +
      " family member" +
      (count > 1 ? "s" : "") +
      " added.";

  }

}


/* =====================================================
   ADD MEMBER
===================================================== */

function addMember() {

  memberCounter++;

  const id =
    memberCounter;


  const member =
    document.createElement("div");

  member.className =
    "member";

  member.dataset.id =
    id;


  member.innerHTML = `

    <div class="member-title">
      <h3>Family Member ${id}</h3>
    </div>

    <label>Full Name *</label>

    <input
      type="text"
      name="member_${id}_full_name"
      required
    >

    <label>Date of Birth</label>

    <input
      type="date"
      name="member_${id}_dob"
    >

    <label>Age</label>

    <input
      type="number"
      name="member_${id}_age"
      min="0"
    >

    <label>Gender</label>

    <select
      name="member_${id}_gender"
    >

      <option value="">
        Select
      </option>

      <option value="Male">
        Male
      </option>

      <option value="Female">
        Female
      </option>

      <option value="Other">
        Other
      </option>

    </select>

    <label>
      Relationship to Family Head
    </label>

    <input
      type="text"
      name="member_${id}_relationship_to_family_head"
      placeholder="Example: Wife, Son, Daughter"
    >

    <label>Marital Status</label>

    <select
      name="member_${id}_marital_status"
    >

      <option value="">
        Select
      </option>

      <option value="Married">
        Married
      </option>

      <option value="Unmarried">
        Unmarried
      </option>

      <option value="Widow/Widower">
        Widow/Widower
      </option>

      <option value="Divorced">
        Divorced
      </option>

      <option value="Other">
        Other
      </option>

    </select>

    <label>Mobile Number</label>

    <input
      type="tel"
      name="member_${id}_mobile_number"
      inputmode="numeric"
      pattern="[0-9]{10}"
      maxlength="10"
      minlength="10"
      placeholder="10-digit mobile number"
    >

    <!-- ================= DISABILITY ================= -->

    <label>
      Disability?
    </label>

    <select
      name="member_${id}_disability"
    >

      <option value="">
        Select
      </option>

      <option value="Yes">
        Yes
      </option>

      <option value="No">
        No
      </option>

    </select>

    <!-- ================= EDUCATION ================= -->

    <h3>Education</h3>

    <label>Education</label>

    <input
      type="text"
      name="member_${id}_education"
      placeholder="Example: 10th, 12th, Graduate"
    >

    <label>Education Status</label>

    <select
      class="memberEducationStatus"
      name="member_${id}_education_status"
    >

      <option value="">
        Select
      </option>

      <option value="Currently Studying">
        Currently Studying
      </option>

      <option value="Completed">
        Completed
      </option>

      <option value="Education Discontinued">
        Education Discontinued
      </option>

      <option value="Never Studied">
        Never Studied
      </option>

      <option value="Not Applicable">
        Not Applicable
      </option>

    </select>

    <div
      class="memberEducationSection hidden section-box"
    >

      <label>
        Reason for Discontinuing Education
      </label>

      <textarea
        name="member_${id}_education_discontinue_reason"
        placeholder="Why was education discontinued?"
      ></textarea>

      <label>
        Would you like to continue education in future?
      </label>

      <select
        class="memberFutureEducation"
        name="member_${id}_future_education"
      >

        <option value="">
          Select
        </option>

        <option value="Yes">
          Yes
        </option>

        <option value="No">
          No
        </option>

      </select>

      <div
        class="memberEducationHelpSection hidden"
      >

        <label>
          Education Help / Support Required?
        </label>

        <select
          class="memberEducationHelp"
          name="member_${id}_education_help"
        >

          <option value="">
            Select
          </option>

          <option value="Yes">
            Yes
          </option>

          <option value="No">
            No
          </option>

        </select>

        <div
          class="memberEducationHelpDetailsSection hidden"
        >

          <label>
            Education Help / Support Details
          </label>

          <textarea
            name="member_${id}_education_help_details"
            placeholder="What education help is required?"
          ></textarea>

        </div>

      </div>

    </div>

    <!-- ================= EMPLOYMENT ================= -->

    <div class="memberEmploymentSection">

      <h3>Employment</h3>

      <label>Occupation</label>

      <input
        type="text"
        name="member_${id}_occupation"
      >

      <label>Employment Status</label>

      <select
        class="memberEmploymentStatus"
        name="member_${id}_employment_status"
      >

        <option value="">
          Select
        </option>

        <option value="Employed">
          Employed

/* =====================================================
   SUBMIT
===================================================== */

familyForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    /* =================================================
       NATIVE VALIDATION
    ================================================= */

    if (!familyForm.checkValidity()) {

      familyForm.reportValidity();

      return;

    }


    /* =================================================
       GET MEMBERS
    ================================================= */

    const members =
      Array.from(
        membersContainer.querySelectorAll(
          ".member"
        )
      );


    const totalFamilyMembers =
      Number(
        document
          .getElementById("totalMembers")
          .value || 0
      );


    if (
  members.length !==
  (totalFamilyMembers - 1)
) {
      showStatus(
        "Please add exactly " +
        totalFamilyMembers +
        " family member(s). Currently " +
        members.length +
        " member(s) have been added.",
        "error"
      );

      return;

    }


    /* =================================================
       MEMBER MOBILE VALIDATION
    ================================================= */

    for (const member of members) {

      const mobile =
        member.querySelector(
          `[name="member_${member.dataset.id}_mobile_number"]`
        );


      if (
        mobile &&
        mobile.value &&
        !/^[0-9]{10}$/.test(
          mobile.value
        )
      ) {

        showStatus(
          "Please enter a valid 10-digit mobile number for Family Member " +
          member.dataset.id +
          ".",
          "error"
        );

        mobile.focus();

        return;

      }

    }


    submitBtn.disabled = true;

    addMemberBtn.disabled = true;


    showStatus(
      "Saving registration. Please wait...",
      "info"
    );


    try {

      const formData =
        new FormData(familyForm);


      /* =================================================
         CREATE FAMILY ID
      ================================================= */

      const familyId =
        (
          window.crypto &&
          typeof window.crypto.randomUUID ===
            "function"
        )

        ? window.crypto.randomUUID()

        : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
            .replace(
              /[xy]/g,
              function(c) {

                const r =
                  Math.random() * 16 | 0;

                const v =
                  c === "x"
                    ? r
                    : (r & 0x3 | 0x8);

                return v.toString(16);

              }
            );


      /* =================================================
         FAMILY HEAD CONDITIONS
      ================================================= */

      const familyHeadEducationStatusValue =
        formData.get(
          "family_head_education_status"
        );

      const familyHeadEducationDiscontinued =
        familyHeadEducationStatusValue ===
        "Education Discontinued";

      const familyHeadFutureEducationValue =
        familyHeadEducationDiscontinued
          ? formData.get(
              "family_head_future_education"
            )
          : null;

      const familyHeadEducationFutureYes =
  familyHeadFutureEducationValue === "Yes";

const familyHeadEducationHelpValue =
  familyHeadEducationFutureYes
    ? formData.get("family_head_education_help")
    : null;
      const familyHeadHealthValue =
        formData.get(
          "healthcare_access_problem"
        );

      const familyHeadHasHealthProblem =
        familyHeadHealthValue === "Yes";


      /* =================================================
         FAMILY DATA
      ================================================= */

      const familyData = {

        id: familyId,

        family_head_name:
          formData.get(
            "family_head_name"
          ) || null,

        family_head_dob:
          formData.get(
            "family_head_dob"
          ) || null,

        family_head_age:
          formData.get(
            "family_head_age"
          )
            ? Number(
                formData.get(
                  "family_head_age"
                )
              )
            : null,

        family_head_gender:
          formData.get(
            "family_head_gender"
          ) || null,

        family_head_marital_status:
          formData.get(
            "family_head_marital_status"
          ) || null,

        family_head_disability:
          formData.get(
            "family_head_disability"
          ) === "Yes"
            ? true
            : formData.get(
                "family_head_disability"
              ) === "No"
              ? false
              : null,

        family_head_occupation:
          formData.get(
            "family_head_occupation"
          ) || null,

        family_head_employment_status:
          formData.get(
            "family_head_employment_status"
          ) || null,

        family_mobile:
          formData.get(
            "family_mobile_number"
          ) || null,

        state:
          formData.get(
            "state"
          ) || null,

        district:
          formData.get(
            "district"
          ) || null,

        city_village:
          formData.get(
            "city_village"
          ) || null,

        full_address:
          formData.get(
            "full_address"
          ) || null,

        own_house:
          formData.get(
            "own_house"
          ) === "Own House",

        housing_type:
          formData.get(
            "own_house"
          ) || null,

        house_condition:
          formData.get(
            "house_condition"
          ) || null,

        total_members:
          totalFamilyMembers,

        family_head_education:
          formData.get(
            "family_head_education"
          ) || null,

        family_head_education_status:
          familyHeadEducationStatusValue ||
          null,

        family_head_education_discontinue_reason:
          familyHeadEducationDiscontinued
            ? (
                formData.get(
                  "family_head_education_discontinue_reason"
                ) || null
              )
            : null,

        family_head_future_education:
          familyHeadEducationDiscontinued
            ? (
                formData.get(
                  "family_head_future_education"
                ) || null
              )
            : null,

        family_head_education_help:
          familyHeadEducationFutureYes
            ? (
                familyHeadEducationHelpValue ||
                null
              )
            : null,

        family_head_education_help_details:
          familyHeadEducationFutureYes &&
          familyHeadEducationHelpValue === "Yes"
            ? (
                formData.get(
                  "family_head_education_help_details"
                ) || null
              )
            : null,

        healthcare_access_problem:
          familyHeadHealthValue || null,

        healthcare_access_details:
          familyHeadHasHealthProblem
            ? (
                healthcareAccessDetails.value ||
                null
              )
            : null,

        family_head_long_term_condition:
          familyHeadHasHealthProblem
            ? (
                familyHeadLongTermCondition.value ||
                null
              )
            : null,

        family_head_treatment_status:
          familyHeadHasHealthProblem
            ? (
                familyHeadTreatmentStatus.value ||
                null
              )
            : null,

        healthcare_help_required:
          familyHeadHasHealthProblem
            ? (
                healthcareHelpRequired.value ||
                null
              )
            : null,

        healthcare_help_details:
          familyHeadHasHealthProblem &&
          healthcareHelpRequired.value === "Yes"
            ? (
                healthcareHelpDetails.value ||
                null
              )
            : null,

        health_insurance:
          formData.get(
            "health_insurance"
          ) || null,

        health_insurance_needed:
          formData.get(
            "health_insurance"
          ) === "No"
            ? (
                formData.get(
                  "health_insurance_needed"
                ) || null
              )
            : null,

        health_insurance_help_details:
          formData.get(
            "health_insurance"
          ) === "No" &&
          formData.get(
            "health_insurance_needed"
          ) === "Yes"
            ? (
                formData.get(
                  "health_insurance_help_details"
                ) || null
              )
            : null,

        term_life_insurance:
          formData.get(
            "term_life_insurance"
          ) || null,

        other_insurance:
          formData.get(
            "other_insurance"
          ) || null

      };


      /* =================================================
         INSERT FAMILY
      ================================================= */

      const {
        error: familyError
      } =
        await supabaseClient
          .from("families")
          .insert([
            familyData
          ]);


      if (familyError) {

        throw new Error(
          "Family registration failed:\n" +
          familyError.message
        );

      }


      /* =================================================
         MEMBER DATA
      ================================================= */

      const memberRows =
        members.map(
          (member) => {

            const get =
              (name) => {

                const element =
                  member.querySelector(
                    `[name="${name}"]`
                  );

                return element
                  ? element.value || null
                  : null;

              };


            const getIf =
              (name, condition) => {

                if (!condition) {
                  return null;
                }

                return get(name);

              };


            /* ================================
               MEMBER CONDITIONS
            ================================= */

            const educationStatusValue =
              get(
                `member_${member.dataset.id}_education_status`
              );

            const isEducationDiscontinued =
              educationStatusValue ===
              "Education Discontinued";

            const futureEducationValue =
              isEducationDiscontinued
                ? get(
                    `member_${member.dataset.id}_future_education`
                  )
                : null;

            const educationHelpValue =
              isEducationDiscontinued &&
              futureEducationValue === "Yes"
                ? get(
                    `member_${member.dataset.id}_education_help`
                  )
                : null;

            const healthConditionValue =
              get(
                `member_${member.dataset.id}_health_condition`
              );

            const hasHealthProblem =
              healthConditionValue === "Yes";


            /* ================================
               DISABILITY
            ================================= */

            const disabilityValue =
              get(
                `member_${member.dataset.id}_disability`
              );


            return {

              family_id:
                familyId,
member_order:
  members.indexOf(member) + 1,
              
              full_name:
                get(
                  `member_${member.dataset.id}_full_name`
                ),

              dob:
                get(
                  `member_${member.dataset.id}_dob`
                ),

              age:
                get(
                  `member_${member.dataset.id}_age`
                )
                  ? Number(
                      get(
                        `member_${member.dataset.id}_age`
                      )
                    )
                  : null,

              gender:
                get(
                  `member_${member.dataset.id}_gender`
                ),

              relationship_to_family_head:
                get(
                  `member_${member.dataset.id}_relationship_to_family_head`
                ),

              marital_status:
                get(
                  `member_${member.dataset.id}_marital_status`
                ),

              mobile_number:
                get(
                  `member_${member.dataset.id}_mobile_number`
                ),

              disability:
                disabilityValue === "Yes",

              education:
                get(
                  `member_${member.dataset.id}_education`
                ),

              education_status:
                educationStatusValue,

              education_discontinue_reason:
                getIf(
                  `member_${member.dataset.id}_education_discontinue_reason`,
                  isEducationDiscontinued
                ),

              future_education:
                getIf(
                  `member_${member.dataset.id}_future_education`,
                  isEducationDiscontinued
                ),

              education_help:
                getIf(
                  `member_${member.dataset.id}_education_help`,
                  isEducationDiscontinued &&
                  futureEducationValue === "Yes"
                ),

              education_help_details:
                getIf(
                  `member_${member.dataset.id}_education_help_details`,
                  isEducationDiscontinued &&
                  futureEducationValue === "Yes" &&
                  educationHelpValue === "Yes"
                ),

              occupation:
                get(
                  `member_${member.dataset.id}_occupation`
                ),

              employment_status:
                get(
                  `member_${member.dataset.id}_employment_status`
                ),

              health_condition:
                healthConditionValue,

              disease_details:
                getIf(
                  `member_${member.dataset.id}_disease_details`,
                  hasHealthProblem
                ),

              long_term_condition:
                getIf(
                  `member_${member.dataset.id}_long_term_condition`,
                  hasHealthProblem
                ),

              treatment_status:
                getIf(
                  `member_${member.dataset.id}_treatment_status`,
                  hasHealthProblem
                ),

              health_help_required:
                getIf(
                  `member_${member.dataset.id}_health_help_required`,
                  hasHealthProblem
                ),

              health_help_details:
                getIf(
                  `member_${member.dataset.id}_health_help_details`,
                  hasHealthProblem &&
                  get(
                    `member_${member.dataset.id}_health_help_required`
                  ) === "Yes"
                )

            };

          }
        );


      /* =================================================
         INSERT FAMILY MEMBERS
      ================================================= */

      if (
        memberRows.length > 0
      ) {

        const {
          error: memberError
        } =
          await supabaseClient
            .from("family_members")
            .insert(
              memberRows
            );


        if (memberError) {

          throw new Error(
            "Family was saved, but family members could not be saved:\n" +
            memberError.message +
            "\n\nFamily ID: " +
            familyId
          );

        }

      }


      /* =================================================
         SUCCESS
      ================================================= */

      showStatus(
        "Registration submitted successfully!\n\n" +
        "Family ID: " +
        familyId,
        "success"
      );


      /* =========================================
         REFRESH COMPLETE FORM AFTER SUCCESS
      ========================================= */

      setTimeout(
        function() {

          window.location.reload();

        },
        1500
      );


    } catch (error) {

      console.error(error);


      const message =
        error && error.message
          ? error.message
          : "Something went wrong while submitting the registration.";


      if (
        message
          .toLowerCase()
          .includes(
            "invalid api key"
          )
      ) {

        showStatus(
          "Supabase API key is invalid. Please put your real Supabase anon/publishable key in SUPABASE_ANON_KEY. Do NOT use the service_role key.",
          "error"
        );

      } else if (

        message
          .toLowerCase()
          .includes(
            "schema cache"
          )

        ||

        message
          .toLowerCase()
          .includes(
            "could not find the"
          )

      ) {

        showStatus(
          message +
          "\n\nPlease check that the required Supabase columns exist in the database.",
          "error"
        );

      } else {

        showStatus(
          message,
          "error"
        );

      }


      submitBtn.disabled = false;

      addMemberBtn.disabled = false;

    }

  }
);

   INITIAL STATE
===================================================== */

updateMemberCount();
